apisix:
  node_listen: 9080
  enable_admin: false
  enable_control: false
  enable_ipv6: false
  ssl:
    enable: false

nginx_config:
  # One worker keeps the local fixture small; requests remain concurrent.
  worker_processes: 1
  envs:
    - CSRF_REPRO_SIGNING_KEY

deployment:
  role: data_plane
  role_data_plane:
    config_provider: yaml

# Keep the reproduction focused on the native plugin under investigation.
plugins:
  - csrf
